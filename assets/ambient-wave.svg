<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clean Flow Animation</title>
  <desc id="desc">A simple looping animation with a calm wave line and soft pulsing dots for dark themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="120" x2="880" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="pulse" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 120) rotate(90) scale(62)">
      <stop stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60" y="-60" width="1120" height="360" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="28" fill="url(#bg)"/>

  <g opacity="0.35" filter="url(#blur)">
    <circle cx="230" cy="70" r="44" fill="#60a5fa">
      <animate attributeName="cx" values="230;265;230" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="52" fill="#34d399">
      <animate attributeName="cy" values="170;150;170" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M120 122C210 92 290 92 380 122C470 152 530 152 620 122C710 92 790 92 880 122" stroke="url(#line)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" values="M120 122C210 92 290 92 380 122C470 152 530 152 620 122C710 92 790 92 880 122;M120 122C210 142 290 142 380 122C470 102 530 102 620 122C710 142 790 142 880 122;M120 122C210 92 290 92 380 122C470 152 530 152 620 122C710 92 790 92 880 122"/>
  </path>

  <circle cx="500" cy="120" r="56" fill="url(#pulse)">
    <animate attributeName="r" values="56;72;56" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.95;1;0.95" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="120" r="18" fill="#e2e8f0">
    <animate attributeName="r" values="18;14;18" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g>
    <circle cx="300" cy="88" r="5" fill="#93c5fd">
      <animate attributeName="cy" values="88;100;88" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="72" r="4" fill="#6ee7b7">
      <animate attributeName="cy" values="72;84;72" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="154" r="5" fill="#f9a8d4">
      <animate attributeName="cy" values="154;142;154" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="164" r="4" fill="#fde68a">
      <animate attributeName="cy" values="164;150;164" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
