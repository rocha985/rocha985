<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Footer Wave Animation</title>
  <desc id="desc">Elegant footer wave with smooth gradient</desc>
  
  <defs>
    <linearGradient id="footerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Main wave layer -->
  <path d="M0,80 Q300,60 600,80 T1200,80 L1200,200 L0,200 Z" fill="url(#footerGradient)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0,80 Q300,60 600,80 T1200,80 L1200,200 L0,200 Z;M0,100 Q300,120 600,100 T1200,100 L1200,200 L0,200 Z;M0,80 Q300,60 600,80 T1200,80 L1200,200 L0,200 Z"/>
  </path>

  <!-- Secondary wave layer for depth -->
  <path d="M0,120 Q300,140 600,120 T1200,120 L1200,200 L0,200 Z" fill="#4f46e5" opacity="0.25">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0,120 Q300,140 600,120 T1200,120 L1200,200 L0,200 Z;M0,100 Q300,80 600,100 T1200,100 L1200,200 L0,200 Z;M0,120 Q300,140 600,120 T1200,120 L1200,200 L0,200 Z"/>
  </path>
</svg>
